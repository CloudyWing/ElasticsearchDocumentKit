  summary: 表示 from/size 分頁查詢的設定。
  remarks: >-
    <code>from + size</code> 超過 Elasticsearch 的 <code>index.max_result_window</code>（預設 10000）時請求會失敗，

    需要深度分頁時改用 search-after。不同頁之間不保證查詢同一份快照。
