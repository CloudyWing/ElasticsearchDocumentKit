  syntax:
    content: public bool TrackTotalHits { get; init; }
    parameters: []
    return:
      type: System.Boolean
      description: >-
        若要精確計算，則為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>（送出 <code>track_total_hits: true</code>）；

        否則為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>，此時結果的 <xref href="CloudyWing.ElasticsearchDocumentKit.Search.DocumentPageResult%601.TotalCount" data-throw-if-not-resolved="false"></xref> 為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。

