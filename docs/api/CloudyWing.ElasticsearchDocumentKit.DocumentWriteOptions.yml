  summary: 取得或設定寫入後的 refresh 行為。
  example: []
  syntax:
    content: public Refresh? Refresh { get; init; }
    parameters: []
    return:
      type: System.Nullable{Elastic.Clients.Elasticsearch.Refresh}
      description: >-
        未設定時不送出 refresh 參數，由 Elasticsearch 依 index 設定決定可見時機。

        設定為 <xref href="Elastic.Clients.Elasticsearch.Refresh.True" data-throw-if-not-resolved="false"></xref> 或 <xref href="Elastic.Clients.Elasticsearch.Refresh.WaitFor" data-throw-if-not-resolved="false"></xref>

        可讓寫入結果在回應後立即可被查詢，但會增加每次寫入的成本。
