  summary: 依 from/size 方式查詢指定頁的文件，並回傳符合條件的總筆數。
  remarks: >-
    不同頁之間不保證查詢同一份快照，查詢期間資料異動可能造成重複或遺漏。需要深度分頁時改用

    <xref href="CloudyWing.ElasticsearchDocumentKit.IElasticsearchDocumentStore%601.SearchAfterAsync(CloudyWing.ElasticsearchDocumentKit.Search.SearchAfterRequest%7b%600%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>。
  example: []
  syntax:
    content: Task<DocumentPageResult<TDocument>> SearchPageAsync(DocumentPageRequest<TDocument> request, CancellationToken cancellationToken = default)
    parameters:
    - id: request
      type: CloudyWing.ElasticsearchDocumentKit.Search.DocumentPageRequest{{TDocument}}
      description: 分頁查詢設定。
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: 取消權杖。
    return:
      type: System.Threading.Tasks.Task{CloudyWing.ElasticsearchDocumentKit.Search.DocumentPageResult{{TDocument}}}
      description: >-
        分頁查詢結果。頁碼超出範圍時為成功結果、空文件集合與實際總筆數；

        <code>from + size</code> 超過 Elasticsearch 的 <code>index.max_result_window</code> 時為失敗結果。
    content.vb: Function SearchPageAsync(request As DocumentPageRequest(Of TDocument), cancellationToken As CancellationToken = Nothing) As Task(Of DocumentPageResult(Of TDocument))
  overload: CloudyWing.ElasticsearchDocumentKit.IElasticsearchDocumentStore`1.SearchPageAsync*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">request</code> 為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: >-
      <xref href="CloudyWing.ElasticsearchDocumentKit.Search.DocumentPageRequest%601.PageNumber" data-throw-if-not-resolved="false"></xref> 或 <xref href="CloudyWing.ElasticsearchDocumentKit.Search.DocumentPageRequest%601.PageSize" data-throw-if-not-resolved="false"></xref>

      小於 1，或略過筆數 <code>(PageNumber - 1) * PageSize</code> 超過 <xref href="System.Int32.MaxValue" data-throw-if-not-resolved="false"></xref>。
