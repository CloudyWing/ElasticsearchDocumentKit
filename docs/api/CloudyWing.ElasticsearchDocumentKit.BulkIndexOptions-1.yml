  assemblies:
  - CloudyWing.ElasticsearchDocumentKit
  namespace: CloudyWing.ElasticsearchDocumentKit
  summary: 取得或設定一個值，用以指出是否允許在文件模型未設定 IdSelector 時啟用重試。
  example: []
  syntax:
    content: public bool AllowRetryWithoutIdSelector { get; init; }
    parameters: []
    return:
      type: System.Boolean
      description: >-
        若要在未設定 IdSelector 時仍允許重試，則為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>；否則為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>。預設為 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>。

        未設定 IdSelector 而重試時，沒有固定 _id 的文件可能因整批重送而重複寫入，僅適用於可接受 at-least-once 的呼叫端。
    content.vb: Public Property AllowRetryWithoutIdSelector As Boolean
