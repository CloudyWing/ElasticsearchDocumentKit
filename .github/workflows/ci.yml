name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    uses: CloudyWing/devops-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      solution: ElasticsearchDocumentKit.slnx
      warnaserror: true
      test-args: --filter TestCategory!=Integration
      pack: true

  integration:
    name: Testcontainers Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ElasticsearchDocumentKit.slnx

      - name: Run Testcontainers integration tests
        run: >
          dotnet test tests/ElasticsearchDocumentKit.Tests.Testcontainers/ElasticsearchDocumentKit.Tests.Testcontainers.csproj
          --configuration Release
          --filter TestCategory=Integration
